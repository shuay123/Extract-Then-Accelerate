# config_seru.yaml
# 实例参数
num_of_workers: 25
num_of_batches: 300
max_num_of_batches: 500

num_of_batch_types: 5
R: 0.4
# 分散程度
T: 0.5
# 截止时间的紧迫程度


# 是否计算延迟
is_tardiness: True

# Excel表名配置


# 多能工系数
max_num_of_multiple_task: 10
# 换装时间
setup_time: 20

